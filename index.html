<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Mi Plataforma Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .caja {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%; max-width: 400px;
        }
        h1 { color: #2563eb; text-align: center; margin-bottom: 10px; }
        .subtitulo { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
        }
        button {
            width: 100%; padding: 14px; background: #2563eb; color: white;
            border: none; border-radius: 6px; font-size: 16px;
            font-weight: bold; cursor: pointer;
        }
        button:hover { background: #1e40af; }
        .mensaje {
            margin-top: 20px; padding: 12px; border-radius: 6px;
            text-align: center; font-size: 14px; display: none;
        }
        .mensaje.ok { background: #d1fae5; color: #065f46; display: block; }
        .mensaje.error { background: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>🎓 Mi Plataforma Escolar</h1>
        <p class="subtitulo">Ingresa con tu cuenta</p>

        <label for="rol">Soy:</label>
        <select id="rol">
            <option value="">-- Selecciona tu rol --</option>
            <option value="docente">👨‍🏫 Docente</option>
            <option value="estudiante">🎓 Estudiante</option>
            <option value="padre">👨‍👩‍👧 Padre de familia</option>
        </select>

        <label for="email">Correo:</label>
        <input type="email" id="email" placeholder="tu@correo.com">

        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="Tu contraseña">

        <button onclick="ingresar()">Ingresar</button>

        <div id="mensaje" class="mensaje"></div>
    </div>

    <script>
        async function ingresar() {
            const rol = document.getElementById('rol').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!rol) { mostrarMensaje('Selecciona tu rol', 'error'); return; }
            if (!email) { mostrarMensaje('Escribe tu correo', 'error'); return; }
            if (!password) { mostrarMensaje('Escribe tu contraseña', 'error'); return; }

            mostrarMensaje('Verificando credenciales...', 'ok');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rol, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    mostrarMensaje(`¡Bienvenido/a!`, 'ok');
                    
                    // Guardamos la sesión
                    localStorage.setItem('rol', data.rol);
                    localStorage.setItem('email', data.email);

                    setTimeout(() => {
                        if (data.rol === 'docente') window.location.href = 'docente.html';
                        if (data.rol === 'estudiante') window.location.href = 'estudiante.html';
                        if (data.rol === 'padre') window.location.href = 'padre.html';
                    }, 1000);
                } else {
                    mostrarMensaje('❌ ' + (data.error || 'Credenciales incorrectas'), 'error');
                }
            } catch (error) {
                mostrarMensaje('❌ Error de conexión con el servidor', 'error');
            }
        }

        function mostrarMensaje(texto, tipo) {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = texto;
            mensaje.className = 'mensaje ' + tipo;
        }
    </script>
</body>
</html>
